<title id="figTitle">Honeypot attacks by sensor, 13-17 August 2026</title>
<desc id="figDesc">Horizontal bar chart of attacks recorded by each honeypot sensor over five days, totalling 762 thousand. Honeytrap 303 thousand, Cowrie 243 thousand, RDPHoneypot 153 thousand, Sentrypeer 36 thousand, Dionaea 14 thousand, Honeyaml 5 thousand, Tanner 2 thousand, ConPot 2 thousand, Heralding 1 thousand, H0neytr4p 1 thousand. Cowrie is highlighted because this report analyses its data.</desc>
